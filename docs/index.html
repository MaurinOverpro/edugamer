        /* Reset e base */
        body {
            background-color: #0a0e17;
            color: #e2e8f0;

            height: 100dvh; /* Usa dynamic viewport height per mobile */
            width: 100vw;
            overflow: hidden; /* Evita scroll della pagina intera */
            margin: 0;
            padding: 0;
        }

        /* Card Stile Cyberpunk */
        .cyber-card { 
            background: rgba(30, 41, 59, 0.7); 
            border: 1px solid #334155; 
            transition: all 0.2s ease; 
            cursor: pointer; 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border-radius: 16px; 
            position: relative;
            overflow: hidden;
        }
        
        /* Effetti hover e active per touch */
        .cyber-card:active { transform: scale(0.96); }
        @media (hover: hover) {
            .cyber-card:hover { 
                border-color: #4ade80; 
                transform: translateY(-5px); 
                box-shadow: 0 0 20px rgba(74, 222, 128, 0.2); 
            }
        }

        /* ── Home: logo, carte, banner isola ── */
        .home-logo {
            width: 52px; height: 52px; border-radius: 16px; font-size: 28px;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 35% 30%, #1e3a5f, #071226);
            border: 2px solid #fbbf24; box-shadow: 0 0 18px rgba(251,191,36,0.35);
        }
        .home-title {
            background: linear-gradient(180deg, #fde68a, #f59e0b);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .home-icon-btn {
            min-width: 56px; min-height: 56px; padding: 0 14px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            color: #e2e8f0; text-decoration: none; cursor: pointer;
            background: linear-gradient(180deg, rgba(51,65,85,0.7), rgba(15,23,42,0.85));
            border: 1px solid rgba(148,163,184,0.3);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.35);
            transition: transform 0.15s, border-color 0.2s;
        }
        .home-icon-btn:active { transform: scale(0.94); }
        .home-icon-btn:hover { border-color: rgba(251,191,36,0.6); }
        .home-xp-card {
            position: relative; overflow: hidden; border-radius: 20px;
            background: linear-gradient(135deg, rgba(69,40,4,0.55), rgba(15,23,42,0.9) 60%);
            border: 1px solid rgba(251,191,36,0.35);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(253,230,138,0.12);
        }
        .home-xp-card::after {
            content: "⚓"; position: absolute; right: -6px; bottom: -28px;
            font-size: 110px; opacity: 0.06; pointer-events: none;
        }
        .home-island {
            position: relative; overflow: hidden; display: flex; align-items: flex-end;
            min-height: 132px; padding: 16px; border-radius: 20px; text-decoration: none;
            border: 2px solid rgba(251,191,36,0.55);
            box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 24px rgba(56,189,248,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .home-island::before {
            content: ""; position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(90deg, rgba(2,6,23,0.75) 0%, rgba(2,6,23,0.25) 55%, transparent 100%);
        }
        .home-island:active { transform: scale(0.98); }
        @media (hover: hover) { .home-island:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(0,0,0,0.5), 0 0 30px rgba(251,191,36,0.25); } }
        .home-island-title { text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
        .home-sail {
            min-height: 56px; padding: 0 18px; border-radius: 16px; display: flex; align-items: center;
            font-weight: 900; color: #1c1003;
            background: linear-gradient(135deg, #fde68a, #fbbf24 50%, #f59e0b);
            box-shadow: 0 4px 16px rgba(251,191,36,0.45);
        }
        @keyframes hb-sail { 0%,100% { transform: translate(70px,80px) rotate(-2deg); } 50% { transform: translate(96px,79px) rotate(2deg); } }
        @keyframes hb-wave { to { transform: translateX(-40px); } }
        .hb-ship { animation: hb-sail 9s ease-in-out infinite; }
        .hb-wave { animation: hb-wave 4s linear infinite; }
        .home-module {
            min-height: 150px;
            background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--mc) 16%, transparent), rgba(15,23,42,0.85) 70%) !important;
            border: 1px solid color-mix(in srgb, var(--mc) 45%, transparent) !important;
            box-shadow: 0 8px 22px rgba(0,0,0,0.35);
        }
        @media (hover: hover) {

            background: linear-gradient(90deg, #f59e0b, #fbbf24, #fde68a, #fbbf24, #f59e0b);

                min-height: 100px !important;
            }

                margin-bottom: 0.5rem !important;
            }
        }
