    <style>
        * { letter-spacing: 0.02em; }
        html, body, #root { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { 
            background: linear-gradient(135deg, #0a0e17 0%, #1a1a2e 100%);
            color: white; 
            font-family: 'OpenDyslexic', Verdana, sans-serif;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* XP BAR */
        .xp-bar-bg {
            background: #1e293b;
            border-radius: 9999px;
            height: 24px;
            overflow: hidden;
            position: relative;
        }
        .xp-bar-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.5s ease-out;
            position: relative;
            overflow: hidden;
        }
        .xp-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            to { left: 100%; }
        }

        /* ACHIEVEMENT CARD */
        .achievement-card {
            transition: all 0.2s;
        }
        .achievement-card:hover {
            transform: translateY(-2px);
        }
        .achievement-locked {
            filter: grayscale(100%);
            opacity: 0.5;
        }

        /* RARITY COLORS */
        .rarity-comune { border-color: #94a3b8; }
        .rarity-raro { border-color: #3b82f6; }
        .rarity-epico { border-color: #a855f7; }
        .rarity-leggendario { border-color: #fbbf24; }

        /* STAT CARD */
        .stat-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        /* STREAK FIRE */
        .streak-fire {
            animation: flicker 0.5s infinite alternate;
        }
        @keyframes flicker {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* TAB BUTTONS */
        .tab-btn {
            transition: all 0.2s;
        }
        .tab-btn.active {
            transform: scale(1.05);
        }
    </style>
