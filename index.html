<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduGamer OS - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
    <link href="fonts/opendyslexic.css" rel="stylesheet">
    <style>
        /* Reset e base */
        body {
            background-color: #0a0e17;
            color: #e2e8f0;
            font-family: 'OpenDyslexic', Verdana, sans-serif;
            letter-spacing: 0.02em;
            line-height: 1.6;
            height: 100dvh; /* Usa dynamic viewport height per mobile */
            width: 100vw;
            overflow: hidden; /* Evita scroll della pagina intera */
            margin: 0;
            padding: 0;
        }

        /* Card Stile Cyberpunk */
        .cyber-card { 
            background: rgba(30, 41, 59, 0.7); 
            border: 1px solid #334155; 
            transition: all 0.2s ease; 
            cursor: pointer; 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border-radius: 16px; 
            position: relative;
            overflow: hidden;
        }
        
        /* Effetti hover e active per touch */
        .cyber-card:active { transform: scale(0.96); }
        @media (hover: hover) {
            .cyber-card:hover { 
                border-color: #4ade80; 
                transform: translateY(-5px); 
                box-shadow: 0 0 20px rgba(74, 222, 128, 0.2); 
            }
        }

        /* ── Home: logo, carte, banner isola ── */
        .home-logo {
            width: 52px; height: 52px; border-radius: 16px; font-size: 28px;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 35% 30%, #1e3a5f, #071226);
            border: 2px solid #fbbf24; box-shadow: 0 0 18px rgba(251,191,36,0.35);
        }
        .home-title {
            background: linear-gradient(180deg, #fde68a, #f59e0b);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .home-icon-btn {
            min-width: 56px; min-height: 56px; padding: 0 14px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            color: #e2e8f0; text-decoration: none; cursor: pointer;
            background: linear-gradient(180deg, rgba(51,65,85,0.7), rgba(15,23,42,0.85));
            border: 1px solid rgba(148,163,184,0.3);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.35);
            transition: transform 0.15s, border-color 0.2s;
        }
        .home-icon-btn:active { transform: scale(0.94); }
        .home-icon-btn:hover { border-color: rgba(251,191,36,0.6); }
        .home-xp-card {
            position: relative; overflow: hidden; border-radius: 20px;
            background: linear-gradient(135deg, rgba(69,40,4,0.55), rgba(15,23,42,0.9) 60%);
            border: 1px solid rgba(251,191,36,0.35);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(253,230,138,0.12);
        }
        .home-xp-card::after {
            content: "⚓"; position: absolute; right: -6px; bottom: -28px;
            font-size: 110px; opacity: 0.06; pointer-events: none;
        }
        .home-island {
            position: relative; overflow: hidden; display: flex; align-items: flex-end;
            min-height: 132px; padding: 16px; border-radius: 20px; text-decoration: none;
            border: 2px solid rgba(251,191,36,0.55);
            box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 24px rgba(56,189,248,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .home-island::before {
            content: ""; position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(90deg, rgba(2,6,23,0.75) 0%, rgba(2,6,23,0.25) 55%, transparent 100%);
        }
        .home-island:active { transform: scale(0.98); }
        @media (hover: hover) { .home-island:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(0,0,0,0.5), 0 0 30px rgba(251,191,36,0.25); } }
        .home-island-title { text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
        .home-sail {
            min-height: 56px; padding: 0 18px; border-radius: 16px; display: flex; align-items: center;
            font-weight: 900; color: #1c1003;
            background: linear-gradient(135deg, #fde68a, #fbbf24 50%, #f59e0b);
            box-shadow: 0 4px 16px rgba(251,191,36,0.45);
        }
        @keyframes hb-sail { 0%,100% { transform: translate(70px,80px) rotate(-2deg); } 50% { transform: translate(96px,79px) rotate(2deg); } }
        @keyframes hb-wave { to { transform: translateX(-40px); } }
        .hb-ship { animation: hb-sail 9s ease-in-out infinite; }
        .hb-wave { animation: hb-wave 4s linear infinite; }
        .home-module {
            min-height: 150px;
            background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--mc) 16%, transparent), rgba(15,23,42,0.85) 70%) !important;
            border: 1px solid color-mix(in srgb, var(--mc) 45%, transparent) !important;
            box-shadow: 0 8px 22px rgba(0,0,0,0.35);
        }
        @media (hover: hover) {
            .home-module:hover { border-color: var(--mc) !important; box-shadow: 0 0 24px color-mix(in srgb, var(--mc) 35%, transparent); }
        }
        .home-medal {
            width: 68px; height: 68px; border-radius: 50%; font-size: 34px;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 35% 30%, #1e3a5f, #071226);
            border: 2px solid var(--mc);
            box-shadow: 0 0 16px color-mix(in srgb, var(--mc) 45%, transparent), inset 0 0 0 4px rgba(251,191,36,0.12);
        }

        /* Animazione Barra XP */
        .xp-bar-fill {
            background: linear-gradient(90deg, #f59e0b, #fbbf24, #fde68a, #fbbf24, #f59e0b);
            background-size: 200% 100%; 
            animation: shimmer 2s infinite linear; 
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        
        /* Scrollbar personalizzata */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* Gestione schermi con altezza ridotta */
        @media (max-height: 700px) {
            .cyber-card {
                min-height: 120px !important;
            }
            .cyber-card .text-4xl,
            .cyber-card .md\:text-6xl {
                font-size: 2.5rem !important;
            }
            .cyber-card h2 {
                font-size: 1rem !important;
                margin-bottom: 0.5rem !important;
            }
        }

        @media (max-height: 600px) {
            .cyber-card {
                min-height: 100px !important;
            }
            header {
                margin-bottom: 0.5rem !important;
            }
        }
    </style>
    <link href="theme.css" rel="stylesheet">
</head>
<body>
    <div id="root" style="height: 100%;"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const DB = {
            getKey: () => localStorage.getItem('gemini_api_key') || '',
            setKey: (key) => localStorage.setItem('gemini_api_key', key),
            getXP: () => {
                const stats = JSON.parse(localStorage.getItem('edugamer_stats') || '{}');
                return stats.xp !== undefined ? stats.xp : parseInt(localStorage.getItem('edu_xp') || '0');
            },
            getLevel: () => {
                if (window.EduGamer) return window.EduGamer.getLevel().level;
                const xp = DB.getXP();
                const thresholds = [0, 100, 300, 600, 1000, 1500, 2500, 4000, 6000, 10000];
                for (let i = thresholds.length - 1; i >= 0; i--) {
                    if (xp >= thresholds[i]) return i + 1;
                }
                return 1;
            }
        };

        const TUTOR_SUBJECTS = [
            { key: 'matematica', name: 'Matematica', emoji: '📐' },
            { key: 'italiano',   name: 'Italiano',   emoji: '📖' },
            { key: 'storia',     name: 'Storia',     emoji: '📜' },
            { key: 'scienze',    name: 'Scienze',    emoji: '🔬' },
            { key: 'geografia',  name: 'Geografia',  emoji: '🌍' },
            { key: 'arte',       name: 'Arte',       emoji: '🎨' },
        ];

        const App = () => {
            const [xp, setXp] = useState(DB.getXP());
            const [showSettings, setShowSettings] = useState(false);
            const [key, setKey] = useState(DB.getKey());
            const [showTutorMenu, setShowTutorMenu] = useState(false);
            const [voices, setVoices] = useState([]);
            const [voiceName, setVoiceName] = useState(() => localStorage.getItem('edugamer_voice') || '');
            useEffect(() => {
                if (!window.speechSynthesis) return;
                const load = () => setVoices(window.EduGamer ? window.EduGamer.listItalianVoices() : window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('it')));
                load();
                window.speechSynthesis.addEventListener('voiceschanged', load);
                return () => window.speechSynthesis.removeEventListener('voiceschanged', load);
            }, []);
            const [aiVoice, setAiVoice] = useState(() => localStorage.getItem('edugamer_voice_ai') === '1');
            const [voiceSpeed, setVoiceSpeed] = useState(() => parseFloat(localStorage.getItem('edugamer_voice_speed') || '1'));
            const [voiceTest, setVoiceTest] = useState('');
            const SAMPLE = 'Ciao! Questa è la voce che leggerà i testi di EduGamer.';
            const testVoice = async () => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                if (aiVoice && window.EduGamer) {
                    if (!key) { setVoiceTest('Per la voce AI serve la API Key: uso la voce del dispositivo.'); }
                    else {
                        setVoiceTest('Preparo la voce AI…');
                        try {
                            localStorage.setItem('gemini_api_key', key);
                            const url = await window.EduGamer._fetchTTS(SAMPLE, window.EduGamer.AI_VOICE.voices.main);
                            const a = new Audio(url); a.preservesPitch = true; a.playbackRate = voiceSpeed;
                            await a.play(); setVoiceTest('▶ Voce AI');
                            return;
                        } catch (e) { setVoiceTest('Voce AI non disponibile (' + e.message + '): uso la voce del dispositivo.'); }
                    }
                } else setVoiceTest('');
                const u = new SpeechSynthesisUtterance(SAMPLE);
                u.lang = 'it-IT'; u.rate = 0.9;
                const v = voices.find(x => x.name === voiceName) || (window.EduGamer && window.EduGamer.getVoice());
                if (v) u.voice = v;
                window.speechSynthesis.speak(u);
            };
            const [audience, setAudience] = useState(() => window.EduGamer ? window.EduGamer.getAudienceKey() : (localStorage.getItem('edugamer_audience') || 'medie'));

            // Aggiorna XP in tempo reale — reattivo agli eventi invece del polling
            useEffect(() => {
                const refresh = () => setXp(DB.getXP());
                window.addEventListener('edugamer-xp-added', refresh); // XP guadagnato in questa pagina
                window.addEventListener('xpChanged', refresh);
                window.addEventListener('storage', refresh);           // cambi da un'altra scheda
                window.addEventListener('focus', refresh);             // al ritorno sulla home
                return () => {
                    window.removeEventListener('edugamer-xp-added', refresh);
                    window.removeEventListener('xpChanged', refresh);
                    window.removeEventListener('storage', refresh);
                    window.removeEventListener('focus', refresh);
                };
            }, []);

            const saveKey = () => { 
                DB.setKey(key); 
                if (window.EduGamer) window.EduGamer.setAudienceKey(audience); else localStorage.setItem('edugamer_audience', audience);
                if (voiceName) localStorage.setItem('edugamer_voice', voiceName); else localStorage.removeItem('edugamer_voice');
                localStorage.setItem('edugamer_voice_ai', aiVoice ? '1' : '0');
                localStorage.setItem('edugamer_voice_speed', String(voiceSpeed));
                setShowSettings(false); 
                alert("Impostazioni salvate."); 
            };

            if (showSettings) {
                return (
                    <div className="h-full flex items-center justify-center p-4">
                        <div className="bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-600 max-w-md w-full text-center shadow-2xl">
                            <h2 className="text-xl md:text-2xl font-bold mb-4 text-purple-400">⚙️ IMPOSTAZIONI</h2>
                            <p className="text-slate-400 text-sm mb-4">Inserisci qui la API Key di Google AI Studio.</p>
                            <input 
                                type="password" 
                                value={key} 
                                onChange={e => setKey(e.target.value)} 
                                placeholder="Incolla API Key..." 
                                className="w-full bg-slate-900 p-3 md:p-4 rounded-xl mb-4 text-white outline-none border border-slate-600 focus:border-purple-500" 
                            />
                            <p className="text-slate-400 text-sm mb-2 text-left">Chi usa EduGamer? (adatta spiegazioni e tono dell'AI)</p>
                            <div className="grid grid-cols-2 gap-2 mb-4">
                                {[["elementari","🎒","Elementare","6-10 anni"],["medie","📒","Media","11-13 anni"],["superiori","📘","Superiore","14-18 anni"],["adulti","🎓","Università / Adulti","19+ anni"]].map(([k, ic, lb, age]) => (
                                    <button key={k} type="button" onClick={() => setAudience(k)}
                                        className={`p-3 rounded-xl border text-sm font-bold transition-all ${audience === k ? "bg-purple-900/60 border-purple-400 text-white" : "bg-slate-900 border-slate-600 text-slate-300"}`}>
                                        <div className="text-xl">{ic}</div>
                                        <div>{lb}</div>
                                        <div className="text-xs font-normal text-slate-400">{age}</div>
                                    </button>
                                ))}
                            </div>
                            <p className="text-slate-400 text-sm mb-2 text-left">🔊 Voce di lettura</p>
                            <div className="flex gap-2 mb-1">
                                <select value={voiceName} onChange={e => setVoiceName(e.target.value)}
                                    className="flex-1 min-w-0 bg-slate-900 p-3 rounded-xl text-white border border-slate-600 text-sm">
                                    <option value="">Automatica (la più naturale)</option>
                                    {voices.map(v => <option key={v.name} value={v.name}>{v.name}</option>)}
                                </select>
                                <button type="button" onClick={testVoice} className="px-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-sm">▶ Prova</button>
                            </div>
                            <label className="flex items-center gap-3 mt-3 mb-1 text-left cursor-pointer">
                                <input type="checkbox" checked={aiVoice} onChange={e => setAiVoice(e.target.checked)} className="w-6 h-6 accent-purple-500 shrink-0" />
                                <span className="text-sm text-white font-bold">✨ Voce AI (Google) — più naturale e coinvolgente</span>
                            </label>
                            <p className="text-slate-500 text-xs mb-2 text-left">Usa la API Key e la connessione; se mancano, legge la voce del dispositivo. Primo ascolto dopo qualche secondo.</p>
                            {aiVoice && (
                                <div className="flex items-center gap-3 mb-2 text-sm text-slate-300">
                                    <span className="shrink-0">Velocità</span>
                                    <input type="range" min="0.8" max="1.5" step="0.05" value={voiceSpeed} onChange={e => setVoiceSpeed(parseFloat(e.target.value))} className="flex-1 accent-purple-500" />
                                    <span className="w-12 text-right font-mono">{voiceSpeed.toFixed(2)}×</span>
                                </div>
                            )}
                            {voiceTest && <p className="text-purple-300 text-xs mb-2 text-left">{voiceTest}</p>}
                            <p className="text-slate-500 text-xs mb-4 text-left">{voices.length ? `${voices.length} voci italiane su questo dispositivo.` : 'Nessuna voce italiana trovata su questo dispositivo.'} Su iPhone/iPad puoi scaricare voci "Avanzate" da Impostazioni → Accessibilità → Contenuto letto ad alta voce.</p>
                            <div className="flex gap-2 flex-col sm:flex-row">
                                <button onClick={() => setShowSettings(false)} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold p-3 rounded-xl transition-all">ANNULLA</button>
                                <button onClick={saveKey} className="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold p-3 rounded-xl transition-all shadow-lg">SALVA</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const modules = [
                { name: "Lavagna AI",  sub: "Mappe della mente",   file: "lavagna.html",    icon: "🧠", color: "#4ade80" },
                { name: "Matematica",  sub: "Caverna dei numeri",  file: "matematica.html", icon: "📐", color: "#fbbf24" },
                { name: "Italiano",    sub: "Biblioteca sommersa", file: "italiano.html",   icon: "📖", color: "#38bdf8" },
                { name: "Ricerche",    sub: "Esplora e scopri",    file: "ricerche.html",   icon: "📚", color: "#c084fc" },
            ];

            const prog = window.EduGamer ? window.EduGamer.getProgress() : null;
            const lvl = DB.getLevel();
            const lvlName = window.EduGamer?.LEVELS?.[lvl - 1]?.name || '';
            const pct = prog ? Math.min(100, prog.progress) : Math.min(100, xp % 100);

            return (
                <div className="h-full flex flex-col p-3 md:p-6 max-w-4xl mx-auto w-full">

                    {/* HEADER */}
                    <header className="flex justify-between items-center mb-3 md:mb-5 shrink-0 gap-2">
                        <div className="flex items-center gap-3 min-w-0">
                            <div className="home-logo shrink-0" aria-hidden="true">🏴‍☠️</div>
                            <div className="min-w-0">
                                <div className="title-pirate text-xl md:text-3xl font-black leading-none truncate home-title">EduGamer</div>
                                <div className="text-[11px] md:text-xs text-slate-400 truncate mt-1">Il tuo diario di bordo</div>
                            </div>
                        </div>
                        <div className="flex gap-2 shrink-0">
                            <a href="profilo.html" className="home-icon-btn" aria-label="Profilo">
                                <span className="text-xl">👤</span>
                                <span className="hidden sm:inline text-sm font-bold">Profilo</span>
                            </a>
                            <button onClick={() => setShowSettings(true)} className="home-icon-btn" aria-label="Impostazioni">
                                <span className="text-xl">⚙️</span>
                            </button>
                        </div>
                    </header>

                    <div className="flex-1 min-h-0 overflow-y-auto" style={{paddingBottom:'96px'}}>
                        {/* DIARIO DI BORDO: livello + XP */}
                        <div className="home-xp-card p-4 md:p-5 mb-3 md:mb-4">
                            <div className="flex justify-between items-end mb-2 gap-2 relative z-10">
                                <div className="min-w-0">
                                    <div className="text-[11px] uppercase tracking-widest text-amber-200/70 font-bold">Livello {lvl}</div>
                                    <div className="title-pirate text-2xl md:text-3xl font-black text-yellow-300 truncate">{lvlName || `Livello ${lvl}`}</div>
                                </div>
                                <div className="text-right shrink-0">
                                    <div className="text-sm md:text-base text-yellow-100 font-bold">{xp} XP</div>
                                    {prog && !prog.isMax && <div className="text-[11px] text-slate-400">{prog.required - prog.current} al prossimo</div>}
                                </div>
                            </div>
                            <div className="h-4 rounded-full overflow-hidden relative z-10" style={{background:'rgba(2,6,23,0.7)', border:'1px solid rgba(251,191,36,0.3)'}}>
                                <div className="h-full xp-bar-fill rounded-full transition-all duration-1000" style={{ width: `${pct}%` }}></div>
                            </div>
                        </div>

                        {/* BANNER ISOLA */}
                        <a href="isola.html" className="home-island mb-3 md:mb-4" aria-label="Salpa verso l'Isola Misteriosa">
                            <svg viewBox="0 0 320 110" preserveAspectRatio="xMidYMid slice" className="absolute inset-0 w-full h-full" aria-hidden="true">
                                <defs>
                                    <linearGradient id="hb-sky" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0" stopColor="#0b2a55"/><stop offset="1" stopColor="#1d5fa8"/>
                                    </linearGradient>
                                    <radialGradient id="hb-moon" cx="0.5" cy="0.5" r="0.5">
                                        <stop offset="0" stopColor="#fef3c7" stopOpacity="0.9"/><stop offset="1" stopColor="#fef3c7" stopOpacity="0"/>
                                    </radialGradient>
                                </defs>
                                <rect width="320" height="110" fill="url(#hb-sky)"/>
                                <circle cx="270" cy="28" r="26" fill="url(#hb-moon)"/>
                                <circle cx="270" cy="28" r="9" fill="#fef9c3"/>
                                {[[30,14],[70,30],[120,10],[200,22],[300,60],[160,40]].map(([x,y],i)=><circle key={i} cx={x} cy={y} r="1" fill="#fff" opacity="0.7"/>)}
                                <path d="M 150 86 C 170 52, 200 40, 224 48 L 236 34 L 250 50 C 270 56, 286 72, 296 86 Z" fill="#1f6a2e"/>
                                <path d="M 224 48 L 236 34 L 250 50 Z" fill="#6b4423"/>
                                <path d="M 140 88 C 180 80, 260 80, 306 88 Z" fill="#e2b86a"/>
                                <g transform="translate(178,62)"><path d="M0 22 C 1 12, 3 6, 7 0" stroke="#6b4318" strokeWidth="2.4" fill="none"/><path d="M7 0 C 1 -4,-6 -2,-9 3 M7 0 C 12 -5, 18 -3, 20 2 M7 0 C 6 -6, 2 -9,-2 -9" stroke="#22c55e" strokeWidth="3" fill="none" strokeLinecap="round"/></g>
                                <rect y="86" width="320" height="24" fill="#0e3d73"/>
                                <path className="hb-wave" d="M 0 92 q 10 -4 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0" stroke="rgba(186,230,253,0.5)" fill="none" strokeWidth="1.4"/>
                                <g className="hb-ship" transform="translate(70,80)">
                                    <path d="M -14 0 L 14 0 L 10 6 L -10 6 Z" fill="#5b3412"/>
                                    <line x1="0" y1="0" x2="0" y2="-20" stroke="#3b2208" strokeWidth="1.4"/>
                                    <path d="M 1 -18 Q 11 -12, 1 -4 Z" fill="#f5e8c0"/>
                                    <path d="M 0 -20 L 7 -18 L 0 -16 Z" fill="#111827"/>
                                </g>
                            </svg>
                            <div className="relative z-10 flex items-center justify-between w-full gap-3">
                                <div className="min-w-0">
                                    <div className="title-pirate text-xl sm:text-2xl md:text-3xl font-black text-yellow-300 home-island-title leading-tight">Isola Misteriosa</div>
                                    <div className="text-xs md:text-sm text-sky-100/90 mt-1">Scopri le terre che hai sbloccato</div>
                                </div>
                                <span className="home-sail shrink-0"><span aria-hidden="true">⚓</span><span className="hidden sm:inline ml-2">Salpa</span></span>
                            </div>
                        </a>

                        {/* MODULI */}
                        <div className="grid grid-cols-2 gap-3 md:gap-4">
                            {modules.map(m => (
                                <a key={m.name} href={m.file} className="cyber-card home-module p-4 md:p-6 group" style={{'--mc': m.color}}>
                                    <div className="home-medal mb-2 md:mb-3 group-hover:scale-110 transition-transform duration-200">{m.icon}</div>
                                    <h2 className="text-base md:text-xl font-bold text-center leading-tight" style={{color:m.color}}>{m.name}</h2>
                                    <span className="text-[11px] md:text-xs text-slate-300 text-center mt-1">{m.sub}</span>
                                </a>
                            ))}
                        </div>
                    </div>

                    {/* TUTOR BAR — fissa in basso */}
                    <div style={{
                        position:'fixed', bottom:0, left:0, right:0, zIndex:50,
                        background:'rgba(10,14,23,0.97)',
                        borderTop:'1px solid rgba(167,139,250,0.35)',
                        backdropFilter:'blur(12px)',
                        padding:'8px 12px'
                    }}>
                        {/* Selettore materie — appare sopra il pulsante */}
                        {showTutorMenu && (
                            <div style={{
                                display:'grid', gridTemplateColumns:'repeat(3,1fr)',
                                gap:'6px', marginBottom:'8px'
                            }}>
                                {TUTOR_SUBJECTS.map(s => (
                                    <a key={s.key} href={`tutor.html?materia=${s.key}`}
                                        style={{
                                            display:'flex', alignItems:'center', justifyContent:'center', gap:'6px',
                                            padding:'8px 6px', borderRadius:'12px',
                                            background:'rgba(88,28,135,0.5)',
                                            border:'1px solid rgba(167,139,250,0.4)',
                                            color:'#e9d5ff', fontWeight:'bold', fontSize:'13px',
                                            textDecoration:'none', textAlign:'center'
                                        }}>
                                        <span>{s.emoji}</span><span>{s.name}</span>
                                    </a>
                                ))}
                                <a href="tutor.html"
                                    style={{
                                        display:'flex', alignItems:'center', justifyContent:'center', gap:'6px',
                                        padding:'8px 6px', borderRadius:'12px',
                                        background:'rgba(30,41,59,0.8)',
                                        border:'1px solid rgba(100,116,139,0.4)',
                                        color:'#94a3b8', fontWeight:'bold', fontSize:'13px',
                                        textDecoration:'none', textAlign:'center'
                                    }}>
                                    <span>💬</span><span>Domanda libera</span>
                                </a>
                            </div>
                        )}
                        {/* Pulsante principale */}
                        <button
                            onClick={() => setShowTutorMenu(!showTutorMenu)}
                            style={{
                                width:'100%', padding:'12px',
                                borderRadius:'14px',
                                background:'linear-gradient(135deg,#581c87,#7c3aed)',
                                border:'1px solid rgba(167,139,250,0.5)',
                                color:'white', fontWeight:'bold', fontSize:'16px',
                                cursor:'pointer', display:'flex', alignItems:'center',
                                justifyContent:'center', gap:'10px',
                                boxShadow:'0 0 20px rgba(124,58,237,0.4)'
                            }}>
                            <span>🎓</span>
                            <span>CHIEDI AL TUTOR</span>
                            <span style={{fontSize:'12px', opacity:0.7}}>{showTutorMenu ? '▼' : '▲'}</span>
                        </button>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="game-system.js"></script>
</body>
</html>
