<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isola Misteriosa - EduGamer</title>
    <!-- FONT OPENDYSLEXIC (accessibilità DSA) -->
    <link href="fonts/opendyslexic.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { background: #071020; color: white; font-family: 'OpenDyslexic', Verdana, sans-serif; letter-spacing: 0.02em; line-height: 1.6; overflow: hidden; }
        /* Titoli decorativi brevi — tocco "pirata" su manoscritto */
        .title-pirate { font-family: Georgia, 'Times New Roman', serif; letter-spacing: normal; }

        @keyframes wave-scroll { to   { transform: translateX(-50%); } }
        @keyframes float       { 0%,100% { transform: translateY(0);   } 50% { transform: translateY(-5px); } }
        @keyframes slide-up    { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0);   opacity: 1; } }
        @keyframes fade-scale  { from { opacity: 0; transform: scale(0.85); }      to { opacity: 1; transform: scale(1);    } }
        @keyframes xp-glow     { 0%,100% { box-shadow: 0 0 8px rgba(251,191,36,0.4); } 50% { box-shadow: 0 0 22px rgba(251,191,36,0.9); } }
        @keyframes foam-pulse  { 0%,100% { opacity: 0.25; } 50% { opacity: 0.55; } }

        @keyframes wave-bob    { 0%,100% { transform: translate(0,0); opacity: 0.25; } 50% { transform: translate(3px,-2px); opacity: 0.9; } }
        @keyframes march       { to { stroke-dashoffset: -24; } }
        @keyframes river       { to { stroke-dashoffset: -20; } }
        @keyframes pulse-ring  { 0%,100% { opacity: 0.25; } 50% { opacity: 0.75; } }
        @keyframes cloud-move  { from { transform: translateX(-160px); } to { transform: translateX(460px); } }
        @keyframes gull        { 0% { transform: translate(-40px, 20px); } 100% { transform: translate(420px, -30px); } }
        @keyframes fog         { 0%,100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }
        @keyframes here        { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes shine       { from { background-position: -200% 0; } to { background-position: 200% 0; } }

        .isle-wave     { animation: wave-bob 4s ease-in-out infinite; }
        .path-march    { animation: march 2.4s linear infinite; }
        .river-flow    { animation: river 2s linear infinite; }
        .zone-pulse    { animation: pulse-ring 2.6s ease-in-out infinite; }
        .cloud-drift   { animation: cloud-move 90s linear infinite; }
        .cloud-drift-2 { animation: cloud-move 120s linear infinite; }
        .gull-drift    { animation: gull 38s linear infinite; }
        .fog-drift     { animation: fog 5s ease-in-out infinite; }
        .here-bob      { animation: here 1.6s ease-in-out infinite; }
        .zone-btn:focus { outline: none; }
        .zone-btn:focus-visible circle:nth-of-type(1) { stroke: #fbbf24; stroke-width: 3; }

        /* Barra di vetro scuro con filo d'oro (top bar e pannello) */
        .deck-bar {
            background: linear-gradient(180deg, rgba(12,24,48,0.97), rgba(5,12,26,0.97));
            border-bottom: 1px solid rgba(251,191,36,0.28);
            box-shadow: 0 6px 24px rgba(0,0,0,0.45);
        }
        .icon-btn {
            width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; text-decoration: none;
            background: linear-gradient(180deg, rgba(51,65,85,0.75), rgba(15,23,42,0.85));
            border: 1px solid rgba(148,163,184,0.3);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 2px 6px rgba(0,0,0,0.35);
            transition: transform 0.15s, border-color 0.2s;
        }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn:hover  { border-color: rgba(251,191,36,0.6); }
        .icon-btn--gold  { background: linear-gradient(180deg, rgba(146,94,12,0.55), rgba(69,40,4,0.75)); border-color: rgba(251,191,36,0.45); }
        .xp-fill {
            background: linear-gradient(90deg, #f59e0b, #fbbf24, #fde68a, #fbbf24, #f59e0b);
            background-size: 200% 100%; animation: shine 3s linear infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        .zone-float  { animation: float 3.2s ease-in-out infinite; }
        .modal-enter { animation: slide-up 0.3s ease-out; }
        .overlay-enter { animation: fade-scale 0.25s ease-out; }
        .xp-bar-anim { animation: xp-glow 2.5s ease-in-out infinite; }
        .foam-anim   { animation: foam-pulse 3s ease-in-out infinite; }

        .zone-btn { cursor: pointer; transition: transform 0.15s; transform-box: fill-box; transform-origin: center; }
        .zone-btn:active { transform: scale(0.88); }
        .zone-locked { filter: grayscale(1) brightness(0.38); cursor: default; pointer-events: none; }

        input { font-family: 'OpenDyslexic', Verdana, sans-serif; }
        input:focus { outline: none; }
        ::-webkit-scrollbar { width: 0; }
    </style>
    <link href="theme.css" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ── CONSTANTS ──────────────────────────────────────────── */
    const LEVEL_XP    = [0, 100, 300, 600, 1000, 1500, 2500, 4000, 6000, 10000];

    const calcLevel   = (xp) => { let l = 1; LEVEL_XP.forEach((t, i) => { if (xp >= t) l = i + 1; }); return Math.min(l, 10); };
    const xpProgress  = (xp) => {
        const l = calcLevel(xp);
        if (l >= 10) return { cur: xp, needed: LEVEL_XP[9], pct: 100 };
        const base = LEVEL_XP[l-1], next = LEVEL_XP[l];
        return { cur: xp - base, needed: next - base, pct: Math.round((xp - base) / (next - base) * 100) };
    };
    /* Split a zone name into two lines for SVG labels */
    const splitLabel  = (name) => {
        const w = name.split(' ');
        const m = Math.ceil(w.length / 2);
        return [w.slice(0, m).join(' '), w.slice(m).join(' ')];
    };

    /* SVG viewBox: 400 × 520 */
    const ZONES = [
        { id:'porto',      name:'Porto dei Pirati',    emoji:'⚓', unlockLevel:1,  x:199, y:448, color:'#38bdf8', link:'index.html',    pathKey:null,          charId:'squall'    },
        { id:'caverna',    name:'Caverna dei Numeri',  emoji:'🔢', unlockLevel:2,  x:113,  y:254, color:'#fbbf24', link:null,            pathKey:'matematico',  charId:'numerus'   },
        { id:'giungla',    name:'Giungla dei Segreti', emoji:'🌴', unlockLevel:2,  x:320, y:298, color:'#4ade80', link:null,            pathKey:'cartografo',  charId:'zara'      },
        { id:'biblioteca', name:'Biblioteca Sommersa', emoji:'📜', unlockLevel:3,  x:102, y:151, color:'#c084fc', link:null,            pathKey:'scrittore',   charId:'isabella'  },
        { id:'torre',      name:"Torre dell'Oracolo",  emoji:'🔮', unlockLevel:4,  x:321, y:145, color:'#f0abfc', link:null,            pathKey:'fedele',      charId:'mordecai'  },
        { id:'grotta',     name:'Grotta degli Enigmi', emoji:'🗺️', unlockLevel:5,  x:203, y:195, color:'#fb923c', link:null,            pathKey:null,          charId:'rex'       },
        { id:'cripta',     name:'Cripta del Tesoro',   emoji:'💎', unlockLevel:6,  x:271, y:378, color:'#fde68a', link:'profilo.html',  pathKey:null,          charId:'barbanera' },
        { id:'fortezza',   name:'Fortezza del Corsaro',emoji:'🏰', unlockLevel:10, x:199, y:56,  color:'#f87171', link:null,            pathKey:null,          charId:'corsaro'   },
    ];

    const PATHS = [
        ['porto','caverna'],['porto','giungla'],['porto','cripta'],
        ['caverna','biblioteca'],['caverna','grotta'],
        ['giungla','torre'],['giungla','grotta'],
        ['biblioteca','fortezza'],['torre','fortezza'],['grotta','fortezza'],
    ];

    const CHARACTERS = {
        squall:    { name:'Capitano Squall',      emoji:'🦜', color:'#38bdf8', greeting:"Benvenuto sull'Isola Misteriosa, Pirata! Sono Capitano Squall, il guardiano di questo luogo. Più impari, più terre si svelano davanti a te. L'avventura inizia da qui!" },
        numerus:   { name:'Numerus il Kraken',    emoji:'🐙', color:'#fbbf24', greeting:"Argh! Hai osato entrare nella mia Caverna dei Numeri? Ottima mossa! I numeri sono il vero tesoro dell'isola. Padroneggiandoli, diventerai invincibile!" },
        zara:      { name:'Zara la Veggente',     emoji:'🔭', color:'#4ade80', greeting:"La giungla ti accoglie. Io, Zara, vedo connessioni dove altri vedono caos. Con le mappe mentali puoi tenere tutto nella testa, senza fatica. Vieni, ti insegno." },
        isabella:  { name:'Isabella delle Acque', emoji:'🌊', color:'#c084fc', greeting:"Silenzio! Sei nella Biblioteca Sommersa. Le parole sono più potenti di qualsiasi spada. Impara a usarle bene e nessuno potrà fermarti." },
        mordecai:  { name:"L'Oracolo Mordecai",   emoji:'🔮', color:'#f0abfc', greeting:"Viaggiatore... ti aspettavo. Posso rispondere a qualsiasi domanda sul tuo percorso. La vera conoscenza è il tesoro più grande di tutta l'isola." },
        rex:       { name:"Rex l'Enigmista",      emoji:'🗝️', color:'#fb923c', greeting:"Ah ah ah! Hai trovato la mia Grotta? Ma sai risolvere i miei enigmi? Solo i pirati più acuti riescono a superarmi. Sei pronto?" },
        barbanera: { name:'Barbanera',             emoji:'💀', color:'#fde68a', greeting:"Finalmente un pirata degno di ammirare i miei tesori! Ogni medaglia che vedi è una vittoria conquistata con il tuo ingegno. Vieni ad ammirare le tue gemme!" },
        corsaro:   { name:'Il Gran Corsaro',      emoji:'👑', color:'#f87171', greeting:"Sei giunto fino alla vetta... Pochissimi ci riescono. Hai dimostrato forza, intelligenza e perseveranza. Questa fortezza è ora anche tua, Leggenda!" },
    };
    /* Ritratti illustrati (generati con Canva): img/personaggi/<id>.png */
    Object.keys(CHARACTERS).forEach(k => { CHARACTERS[k].img = `img/personaggi/${k}.png`; });

    const PRESET_AVATARS = ['🏴‍☠️','🦜','⚓','💀','🗡️','🔮','🐙','🌊','🗺️','💎','🦊','🐉'];
    /* Nome del livello — fonte di verità in game-system.js (window.EduGamer.LEVELS) */
    const getLevelName = (level) => {
        const L = window.EduGamer?.LEVELS?.[level - 1];
        return L?.name || '';
    };

    /* ── DB ─────────────────────────────────────────────────── */
    const DB = {
        getKey:     () => localStorage.getItem('gemini_api_key'),
        getProfile: () => { try { return JSON.parse(localStorage.getItem('isola_profile')||'null'); } catch { return null; } },
        saveProfile:(p) => localStorage.setItem('isola_profile', JSON.stringify(p)),
        getStats:   () => {
            try {
                const s = JSON.parse(localStorage.getItem('edugamer_stats')||'{}');
                const xp = s.xp || parseInt(localStorage.getItem('edu_xp')||'0');
                return { xp, level: calcLevel(xp) };
            } catch { return { xp:0, level:1 }; }
        },
        getWantedPoster: () => {
            try { return JSON.parse(localStorage.getItem('edugamer_wanted_poster')||'null'); } catch { return null; }
        },
        getPaths: () => {
            if (window.EduGamer?.getPaths) return window.EduGamer.getPaths();
            return [];
        },
        getAvatarHistory: () => {
            try { return JSON.parse(localStorage.getItem('isola_avatars_history')||'[]'); } catch { return []; }
        },
        saveAvatarToHistory: (avatarUrl, name, level) => {
            if (!avatarUrl?.startsWith('data:')) return;
            const history = DB.getAvatarHistory();
            const entry = { avatarUrl, name, level, date: new Date().toISOString() };
            const deduped = history.filter(h => h.avatarUrl !== avatarUrl);
            localStorage.setItem('isola_avatars_history', JSON.stringify([entry, ...deduped].slice(0, 8)));
        },
    };

    /* ── AI ─────────────────────────────────────────────────── */
    const AI = {
        generateAvatar: async (b64, mime, name) => {
            const img = await window.EduGamer.geminiImage(window.EduGamer.MODELS.image, {
                contents:[{parts:[
                    { text:`Crea un avatar pirata cartoon colorato e divertente ispirato a questa foto. Stile fumetto vivace con colori saturi. Il pirata si chiama "${name}". Sfondo semplice. Solo il personaggio, ritratto dall'ombelico in su.` },
                    { inlineData:{ mimeType:mime, data:b64 } }
                ]}],
                generationConfig:{ responseModalities:['IMAGE'] }
            });
            return `data:${img.mime};base64,${img.data}`;
        },

    };

    /* ── ONBOARDING ─────────────────────────────────────────── */
    const Onboarding = ({ existing, onComplete }) => {
        const [name,      setName]      = useState(existing?.name || '');
        const [photoB64,  setPhotoB64]  = useState(null);
        const [photoMime, setPhotoMime] = useState('image/jpeg');
        const [avatarUrl, setAvatarUrl] = useState(existing?.avatarUrl || null);
        const [preset,    setPreset]    = useState(null);
        const [generating,setGenerating]= useState(false);
        const [error,     setError]     = useState('');

        const handlePhoto = (e) => {
            const f = e.target.files[0]; if (!f) return;
            setPhotoMime(f.type || 'image/jpeg');
            const r = new FileReader();
            r.onload = (ev) => { setPhotoB64(ev.target.result.split(',')[1]); setAvatarUrl(ev.target.result); setPreset(null); };
            r.readAsDataURL(f);
        };

        const generateAvatar = async () => {
            if (!photoB64) return;
            if (!DB.getKey()) { setError("⚠️ Chiave API mancante — vai alla Home per inserirla"); return; }
            setGenerating(true); setError('');
            try {
                const url = await AI.generateAvatar(photoB64, photoMime, name||'Pirata');
                setAvatarUrl(url); setPhotoB64(null);
                DB.saveAvatarToHistory(url, name.trim()||'Pirata', DB.getStats().level);
            }
            catch (e) { setError("Errore: " + e.message); }
            finally   { setGenerating(false); }
        };

        const handleComplete = () => {
            if (!name.trim()) { setError("Scegli il tuo nome da pirata!"); return; }
            const avatar  = avatarUrl || preset || '🏴‍☠️';
            const profile = { name: name.trim(), avatarUrl: avatar };
            DB.saveProfile(profile);
            onComplete(profile);
        };

        const preview = avatarUrl?.startsWith('data:')
            ? <img src={avatarUrl} className="w-full h-full object-cover rounded-full"/>
            : <span className="text-5xl">{preset || '🏴‍☠️'}</span>;

        return (
            <div className="min-h-screen flex flex-col items-center justify-start overflow-y-auto py-8 px-4"
                style={{background:'linear-gradient(160deg,#071020 0%,#0d2040 60%,#071020 100%)'}}>
                <div className="w-full max-w-md">
                    <div className="text-center mb-8">
                        <div className="text-7xl mb-3" style={{filter:'drop-shadow(0 0 20px rgba(251,191,36,0.6))'}}>🏴‍☠️</div>
                        <h1 className="title-pirate text-3xl font-black text-yellow-400 tracking-tight mb-1"
                            style={{textShadow:'0 0 30px rgba(251,191,36,0.5)'}}>ISOLA MISTERIOSA</h1>
                        <p className="text-slate-400 text-sm">{existing ? 'Modifica il tuo profilo pirata' : 'Crea il tuo profilo per salpare'}</p>
                    </div>

                    <div className="bg-slate-800/80 rounded-2xl p-5 mb-4 border border-slate-700">
                        <label className="text-yellow-400 font-bold text-xs uppercase tracking-widest mb-2 block">⚓ Il tuo nome da Pirata</label>
                        <input value={name} onChange={e => setName(e.target.value)}
                            placeholder="es. Tempesta dei Mari, Occhio di Fuoco..."
                            className="w-full bg-slate-700/80 text-white rounded-xl px-4 py-3 text-base border border-slate-600 focus:border-yellow-400 transition-colors"/>
                    </div>

                    <div className="bg-slate-800/80 rounded-2xl p-5 mb-4 border border-slate-700">
                        <label className="text-yellow-400 font-bold text-xs uppercase tracking-widest mb-4 block">🎨 Il tuo Avatar</label>
                        <div className="flex justify-center mb-4">
                            <div className="w-28 h-28 rounded-full border-4 border-yellow-400 flex items-center justify-center overflow-hidden bg-slate-700"
                                style={{boxShadow:'0 0 25px rgba(251,191,36,0.4)'}}>
                                {preview}
                            </div>
                        </div>
                        <label className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer mb-3 active:scale-95 transition-all border border-blue-400">
                            <input type="file" accept="image/*" className="hidden" onChange={handlePhoto}/>
                            📷 Carica una foto
                        </label>
                        {photoB64 && (
                            <button onClick={generateAvatar} disabled={generating}
                                className="w-full bg-purple-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 mb-3 active:scale-95 transition-all border border-purple-400 disabled:opacity-50">
                                {generating
                                    ? <><div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"/><span>Creando avatar AI...</span></>
                                    : <><span>✨</span><span>Crea Avatar Pirata con AI</span></>}
                            </button>
                        )}
                        <p className="text-slate-500 text-xs text-center mb-2">Oppure scegli un avatar predefinito</p>
                        <div className="grid grid-cols-6 gap-2">
                            {PRESET_AVATARS.map(em => (
                                <button key={em} onClick={() => { setPreset(em); setAvatarUrl(null); setPhotoB64(null); }}
                                    className={`h-11 rounded-xl text-2xl flex items-center justify-center transition-all border-2 ${preset===em&&!avatarUrl?'border-yellow-400 bg-slate-600 scale-110':'border-slate-600 bg-slate-700/60'}`}>
                                    {em}
                                </button>
                            ))}
                        </div>
                    </div>

                    {error && <div className="bg-red-900/50 border border-red-500 rounded-xl p-3 mb-4 text-red-300 text-sm text-center">{error}</div>}

                    <button onClick={handleComplete}
                        className="w-full font-black py-4 rounded-2xl text-xl text-black active:scale-95 transition-all"
                        style={{background:'linear-gradient(135deg,#fbbf24,#f59e0b)', boxShadow:'0 0 30px rgba(251,191,36,0.5)'}}>
                        {existing ? '💾 Salva Modifiche' : "⚓ SALPA VERSO L'ISOLA!"}
                    </button>
                    {existing && (
                        <button onClick={() => onComplete(existing)}
                            className="w-full mt-3 py-3 rounded-2xl text-slate-400 bg-slate-800 border border-slate-700 font-bold">
                            ← Torna all'isola
                        </button>
                    )}
                </div>
            </div>
        );
    };

    /* ── PARCHMENT MODAL ────────────────────────────────────── */
    const ParchmentModal = ({ onClose }) => (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overlay-enter"
            style={{background:'rgba(0,0,0,0.82)'}} onClick={onClose}>
            <div className="w-full max-w-sm rounded-2xl p-6 relative"
                style={{
                    background:'linear-gradient(150deg,#f5e8c0,#ead9a0,#f0e0b0)',
                    border:'4px solid #8b6410',
                    boxShadow:'0 0 50px rgba(139,100,16,0.6), inset 0 0 30px rgba(180,140,60,0.2)',
                    maxHeight:'82vh', overflowY:'auto'
                }}
                onClick={e => e.stopPropagation()}>

                {/* Decorative corners */}
                {['top-2 left-2','top-2 right-2','bottom-2 left-2','bottom-2 right-2'].map((pos,i) => (
                    <div key={i} className={`absolute ${pos} text-amber-700 text-lg opacity-50`}>✦</div>
                ))}

                <div className="text-center mb-4">
                    <div className="text-5xl mb-2">📜</div>
                    <h2 className="title-pirate text-2xl font-black text-amber-900" style={{textShadow:'1px 1px 2px rgba(100,60,0,0.3)'}}>
                        L'Isola Misteriosa
                    </h2>
                    <div className="h-0.5 bg-amber-700/40 my-3 mx-4 rounded"/>
                </div>

                <div className="text-amber-900 text-sm leading-relaxed space-y-3">
                    <p>🏴‍☠️ <strong>Benvenuto, coraggioso esploratore!</strong></p>
                    <p>L'Isola Misteriosa è il tuo mondo di avventura e conoscenza. Ogni angolo nasconde un tesoro — non d'oro, ma di sapere.</p>
                    <p>Qui <strong>studiare è un'avventura</strong>. Ogni attività che completi nei moduli di EduGamer ti porta nuovi punti esperienza (<strong>XP</strong>). Più XP accumuli, più livelli sali — e più zone si svelano dalla nebbia.</p>
                    <div className="bg-amber-800/10 border border-amber-700/30 rounded-xl p-3 space-y-1">
                        <p>🌴 <strong>Giungla dei Segreti</strong> — crea mappe mentali</p>
                        <p>🔢 <strong>Caverna dei Numeri</strong> — padroneggia la matematica</p>
                        <p>📜 <strong>Biblioteca Sommersa</strong> — affina il tuo italiano</p>
                        <p>🔮 <strong>Torre dell'Oracolo</strong> — il tuo tutor AI personale</p>
                        <p>🗺️ <strong>Grotta degli Enigmi</strong> — risolvi problemi complessi</p>
                        <p>💎 <strong>Cripta del Tesoro</strong> — ammira le tue conquiste</p>
                    </div>
                    <p>E se raggiungerai il <strong>Livello 10</strong>... la <strong>Fortezza del Gran Corsaro</strong> aprirà le sue porte per accoglierti tra le leggende! 🏰</p>
                    <p className="text-center font-bold text-amber-800 pt-1">⚓ Buona fortuna, Pirata! ⚓</p>
                </div>

                <div className="h-0.5 bg-amber-700/40 my-4 mx-4 rounded"/>
                <button onClick={onClose}
                    className="title-pirate w-full py-3 rounded-xl font-bold text-amber-900 border-2 border-amber-700 bg-amber-200/60 active:scale-95 transition-transform">
                    Chiudi la pergamena
                </button>
            </div>
        </div>
    );

    /* ── ISLAND SVG ─────────────────────────────────────────── */
    /* Illustrazione vettoriale dell'isola (viewBox 400×520).
       Ordine dei livelli: oceano → fondali → spiaggia → giungla → rilievi →
       fiume/lago → alberi → sentieri → zone → nuvole → bussola → vignetta. */
    const REDUCED_MOTION = typeof window !== 'undefined' && window.matchMedia
        && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Mappa dipinta (generata con Canva). MAP_BOX = posizione nel viewBox 400×520 */
    const MAP_IMG = 'img/isola-mappa.jpg';
    const MAP_BOX = { x: 10, y: 6, w: 380, h: 504.6 };

    const Ship = () => (
        <g>
            <ellipse cx="0" cy="7" rx="20" ry="3" fill="#bae6fd" opacity="0.25"/>
            <path d="M -18 0 L 18 0 L 13 8 L -13 8 Z" fill="#5b3412" stroke="#2b1606" strokeWidth="1"/>
            <path d="M -16 2.5 L 16 2.5" stroke="#d6a65a" strokeWidth="0.8" opacity="0.7"/>
            <line x1="0" y1="0" x2="0" y2="-26" stroke="#3b2208" strokeWidth="1.6"/>
            <line x1="-9" y1="-1" x2="-9" y2="-16" stroke="#3b2208" strokeWidth="1.2"/>
            <path d="M 1 -24 Q 13 -17, 1 -6 Z" fill="#f5e8c0" stroke="#b08a4a" strokeWidth="0.6"/>
            <path d="M -8 -15 Q 0 -10, -8 -4 Z" fill="#ead9a0" stroke="#b08a4a" strokeWidth="0.5"/>
            <path d="M 0 -26 L 9 -23.5 L 0 -21 Z" fill="#111827"/>
            <circle cx="4.2" cy="-23.6" r="0.9" fill="#f8fafc"/>
        </g>
    );

    const Cloud = ({ x, y, s = 1, cls, delay = 0 }) => (
        <g className={cls} style={{animationDelay: `${delay}s`}}>
            <g transform={`translate(${x},${y}) scale(${s})`}>
                <g opacity="0.16" transform="translate(10,26)">
                    <ellipse cx="0" cy="0" rx="34" ry="10" fill="#020617"/>
                </g>
                <g opacity="0.55">
                    <ellipse cx="0" cy="0" rx="30" ry="10" fill="#e2e8f0"/>
                    <circle cx="-12" cy="-6" r="11" fill="#f1f5f9"/>
                    <circle cx="6" cy="-9" r="14" fill="#f8fafc"/>
                    <circle cx="20" cy="-3" r="9" fill="#e2e8f0"/>
                </g>
            </g>
        </g>
    );

    /* Sentiero curvo tra due zone (curva quadratica, lato alternato) */
    const curvedPath = (a, b, i) => {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const dx = b.x - a.x, dy = b.y - a.y;
        const k = (i % 2 ? 0.16 : -0.16);
        return `M ${a.x} ${a.y} Q ${mx - dy * k} ${my + dx * k} ${b.x} ${b.y}`;
    };

    const WAVES = [[40,-40],[150,-80],[260,-30],[330,-110],[80,-150],[220,-170],[30,560],[140,600],[250,570],[350,620],[90,680],[300,700],[-60,120],[-90,380],[460,200],[440,460],[18,92],[384,236],[386,330],[14,474],[78,498],[150,508],[262,500],[330,508],[384,424],[388,112],[8,196],[296,14],[58,24],[140,6],[372,60],[10,300]];
    const IslandSVG = ({ level, onZoneClick, avatarHistory = [] }) => {
        const avatarBubbles = avatarHistory.filter(h => h.avatarUrl?.startsWith('data:')).slice(0, 3);
        /* "Sei qui": l'ultima zona sbloccata */
        const here = ZONES.filter(z => level >= z.unlockLevel).sort((a, b) => b.unlockLevel - a.unlockLevel)[0];
        const ink = '#3b2506';
        return (
        <svg viewBox="0 0 400 520" style={{width:'100%',height:'100%',display:'block',overflow:'hidden'}} preserveAspectRatio="xMidYMid meet"
            role="img" aria-label="Mappa dell'Isola Misteriosa">
            <defs>
                <linearGradient id="ocean-deep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="520">
                    <stop offset="0%"   stopColor="#054fa6"/>
                    <stop offset="100%" stopColor="#003581"/>
                </linearGradient>
                <filter id="feather" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="9"/>
                </filter>
                <mask id="map-feather" maskUnits="userSpaceOnUse" x="-50" y="-50" width="500" height="620">
                    <rect x={MAP_BOX.x + 14} y={MAP_BOX.y + 12} width={MAP_BOX.w - 28} height={MAP_BOX.h - 24} rx="34" fill="#fff" filter="url(#feather)"/>
                </mask>
                <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="200" cy="260" r="520">
                    <stop offset="50%"  stopColor="#020617" stopOpacity="0"/>
                    <stop offset="100%" stopColor="#020617" stopOpacity="0.6"/>
                </radialGradient>
                <radialGradient id="medal" cx="40%" cy="35%">
                    <stop offset="0%"   stopColor="#1e3a5f"/>
                    <stop offset="100%" stopColor="#071226"/>
                </radialGradient>
                <filter id="soft-blur" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="5"/>
                </filter>
                <filter id="fog-blur" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3.2"/>
                </filter>
                {avatarBubbles.map((_, i) => (
                    <clipPath key={'avclip'+i} id={'av-clip-'+i}>
                        <circle cx={32} cy={355 + i * 44} r="14"/>
                    </clipPath>
                ))}
            </defs>

            {/* ── OCEANO (continua oltre la mappa su schermi stretti o larghi) ── */}
            <rect x="-800" y="-800" width="2000" height="2120" fill="url(#ocean-deep)"/>
            {WAVES.filter(([x, y]) => x < 22 || x > 372 || y < 16 || y > 500).map(([wx, wy], i) => (
                <path key={'w'+i} className="isle-wave" style={{animationDelay:`${(i * 0.37) % 4}s`}}
                    d={`M ${wx} ${wy} q 4 -4 8 0 q 4 -4 8 0`} fill="none"
                    stroke="rgba(186,230,253,0.45)" strokeWidth="1.2" strokeLinecap="round"/>
            ))}

            {/* ── MAPPA DIPINTA (illustrazione Canva, bordi sfumati nel mare) ── */}
            <image href={MAP_IMG} x={MAP_BOX.x} y={MAP_BOX.y} width={MAP_BOX.w} height={MAP_BOX.h}
                preserveAspectRatio="none" mask="url(#map-feather)"/>
            {/* luccichio sul lago */}
            <path d="M 278 232 q 5 -3 10 0 M 291 240 q 5 -3 10 0" fill="none" stroke="rgba(224,242,254,0.8)"
                strokeWidth="1.1" strokeLinecap="round" className="isle-wave"/>

            {/* ── SENTIERI DEL TESORO ── */}
            {PATHS.map(([a,b], i) => {
                const za = ZONES.find(z => z.id===a), zb = ZONES.find(z => z.id===b);
                if (!za || !zb) return null;
                const vis = level >= za.unlockLevel && level >= zb.unlockLevel;
                const d = curvedPath(za, zb, i);
                return (
                    <g key={'path'+i}>
                        <path d={d} fill="none" stroke={vis ? ink : '#0f172a'} strokeWidth="4" opacity={vis ? 0.35 : 0.2} strokeLinecap="round"/>
                        <path d={d} fill="none" stroke={vis ? '#fde68a' : 'rgba(148,163,184,0.35)'}
                            strokeWidth="1.9" strokeDasharray="5,7" strokeLinecap="round"
                            className={vis ? 'path-march' : ''}/>
                    </g>
                );
            })}

            {/* ── ZONE ── */}
            {ZONES.map((zone, idx) => {
                const unlocked = level >= zone.unlockLevel;
                const [l1, l2] = splitLabel(zone.name);
                const lh = l2 ? 26 : 15;
                return (
                    <g key={zone.id}
                        className={`zone-btn ${unlocked ? 'zone-float' : ''}`}
                        onClick={() => onZoneClick(zone)}
                        role="button" tabIndex="0"
                        aria-label={unlocked ? zone.name : `${zone.name}, si svela al livello ${zone.unlockLevel}`}
                        onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onZoneClick(zone); } }}
                        style={{animationDelay:`${idx * 0.45}s`}}>
                        {/* area di tocco ampia (≥ 56px) */}
                        <circle cx={zone.x} cy={zone.y + 8} r="34" fill="transparent"/>
                        <ellipse cx={zone.x} cy={zone.y + 21} rx="17" ry="4.5" fill="#000" opacity="0.35"/>
                        {unlocked ? (
                            <>
                                <circle cx={zone.x} cy={zone.y} r="29" fill="none" stroke={zone.color} strokeWidth="1.5"
                                    className="zone-pulse" style={{filter:`drop-shadow(0 0 6px ${zone.color})`, animationDelay:`${idx*0.3}s`}}/>
                                <circle cx={zone.x} cy={zone.y} r="22" fill="url(#medal)" stroke={zone.color} strokeWidth="2.6"
                                    style={{filter:`drop-shadow(0 2px 8px ${zone.color}88)`}}/>
                                <circle cx={zone.x} cy={zone.y} r="18" fill="none" stroke="#fbbf24" strokeWidth="0.7" opacity="0.55"/>
                                <text x={zone.x} y={zone.y + 7} textAnchor="middle" fontSize="19">{zone.emoji}</text>
                            </>
                        ) : (
                            <>
                                <circle cx={zone.x} cy={zone.y} r="21" fill="#0b1324" stroke="#334155" strokeWidth="1.5" opacity="0.9"/>
                                <g style={{filter:'url(#fog-blur)'}} className="fog-drift">
                                    <circle cx={zone.x - 12} cy={zone.y + 2} r="13" fill="#cbd5e1" opacity="0.5"/>
                                    <circle cx={zone.x + 10} cy={zone.y - 4} r="15" fill="#e2e8f0" opacity="0.45"/>
                                    <circle cx={zone.x + 2}  cy={zone.y + 9} r="12" fill="#94a3b8" opacity="0.45"/>
                                </g>
                                <text x={zone.x} y={zone.y + 5} textAnchor="middle" fontSize="14">🔒</text>
                                <rect x={zone.x - 15} y={zone.y - 33} width="30" height="13" rx="6.5" fill="#0f172a" stroke="#fbbf24" strokeWidth="0.8" opacity="0.95"/>
                                <text x={zone.x} y={zone.y - 23.8} textAnchor="middle" fontSize="7.5" fontWeight="bold"
                                    fontFamily="OpenDyslexic, Verdana, sans-serif" fill="#fbbf24">Lv.{zone.unlockLevel}</text>
                            </>
                        )}
                        {/* Etichetta su pergamena */}
                        <rect x={zone.x-49} y={zone.y+27} width="98" height={lh} rx="4"
                            fill={unlocked ? '#f5e8c0' : 'rgba(15,23,42,0.78)'}
                            stroke={unlocked ? '#8b6410' : '#334155'} strokeWidth="1"/>
                        <text textAnchor="middle" fontSize="8.5" fontWeight="bold" fontFamily="OpenDyslexic, Verdana, sans-serif"
                            fill={unlocked ? ink : '#94a3b8'}>
                            <tspan x={zone.x} y={zone.y + 38}>{l1}</tspan>
                            {l2 && <tspan x={zone.x} dy="11">{l2}</tspan>}
                        </text>
                    </g>
                );
            })}

            {/* ── SEI QUI: bandierina sull'ultima zona sbloccata ── */}
            {here && (
                <g className="here-bob" style={{pointerEvents:'none'}}>
                    <line x1={here.x + 17} y1={here.y - 14} x2={here.x + 17} y2={here.y - 40} stroke="#3b2208" strokeWidth="1.6" strokeLinecap="round"/>
                    <path d={`M ${here.x + 17} ${here.y - 40} L ${here.x + 35} ${here.y - 34} L ${here.x + 17} ${here.y - 28} Z`} fill="#dc2626" stroke="#7f1d1d" strokeWidth="0.6"/>
                    <circle cx={here.x + 24} cy={here.y - 34} r="2.2" fill="#f8fafc"/>
                </g>
            )}

            {/* ── NAVE (naviga lungo la costa sud) ── */}
            {REDUCED_MOTION ? (
                <g transform="translate(300,494) scale(0.75)"><Ship/></g>
            ) : (
                <g>
                    <g transform="scale(0.75)">
                        <g>
                            <Ship/>
                            <animateMotion dur="80s" repeatCount="indefinite"
                                path="M -60 660 C 60 650, 160 672, 270 656 S 460 650, 600 662"/>
                        </g>
                    </g>
                </g>
            )}

            {/* ── GABBIANI ── */}
            <g className="gull-drift" style={{pointerEvents:'none'}}>
                <path d="M 0 0 q 3 -3 6 0 q 3 -3 6 0" transform="translate(60,70)" fill="none" stroke="#f8fafc" strokeWidth="1.1" strokeLinecap="round"/>
                <path d="M 0 0 q 2.4 -2.4 4.8 0 q 2.4 -2.4 4.8 0" transform="translate(76,62)" fill="none" stroke="#f8fafc" strokeWidth="1" strokeLinecap="round"/>
            </g>

            {/* ── NUVOLE ── */}
            <g style={{pointerEvents:'none'}}>
                <Cloud x={40}  y={150} s={0.9} cls="cloud-drift"   delay={0}/>
                <Cloud x={120} y={330} s={0.7} cls="cloud-drift-2" delay={-30}/>
                <Cloud x={20}  y={455} s={0.6} cls="cloud-drift"   delay={-55}/>
            </g>

            {/* ── STORICO AVATAR ── */}
            {avatarBubbles.map((av, i) => {
                const bx = 32, by = 355 + i * 44;
                return (
                    <g key={'av'+i} opacity="0.95">
                        <circle cx={bx} cy={by} r="17" fill="rgba(10,18,38,0.95)" stroke="#fbbf24" strokeWidth="2"/>
                        <image href={av.avatarUrl} x={bx-14} y={by-14} width="28" height="28"
                            clipPath={'url(#av-clip-'+i+')'} preserveAspectRatio="xMidYMid slice"/>
                        <circle cx={bx} cy={by} r="17" fill="none" stroke="#fbbf24" strokeWidth="2"/>
                        <rect x={bx-14} y={by+19} width="28" height="11" rx="5.5" fill="#0f172a" opacity="0.9"/>
                        <text x={bx} y={by+27} textAnchor="middle" fontSize="7.5" fill="#fbbf24" fontWeight="bold" fontFamily="OpenDyslexic, Verdana, sans-serif">Lv.{av.level}</text>
                    </g>
                );
            })}

            {/* ── ROSA DEI VENTI ── */}
            <g transform="translate(366, 40)" style={{pointerEvents:'none'}}>
                <circle r="25" fill="rgba(245,232,192,0.92)" stroke="#8b6410" strokeWidth="1.5"/>
                <circle r="20" fill="none" stroke="#8b6410" strokeWidth="0.6" opacity="0.6"/>
                <g opacity="0.55">
                    <polygon points="0,-15 3,-3 15,0 3,3 0,15 -3,3 -15,0 -3,-3" fill="#a16207" transform="rotate(45)"/>
                </g>
                <polygon points="0,-18 4,-4 0,0" fill="#b91c1c"/>
                <polygon points="0,-18 -4,-4 0,0" fill="#ef4444"/>
                <polygon points="0,18 4,4 0,0"  fill="#3b2506"/>
                <polygon points="0,18 -4,4 0,0" fill="#78350f"/>
                <polygon points="18,0 4,4 0,0"  fill="#3b2506"/>
                <polygon points="18,0 4,-4 0,0" fill="#78350f"/>
                <polygon points="-18,0 -4,-4 0,0" fill="#3b2506"/>
                <polygon points="-18,0 -4,4 0,0"  fill="#78350f"/>
                <circle r="2.4" fill="#fbbf24" stroke="#78350f" strokeWidth="0.6"/>
                <text y="-20.5" textAnchor="middle" fontSize="6" fontWeight="bold" fill="#7f1d1d" fontFamily="Georgia, serif">N</text>
            </g>

            {/* ── VIGNETTA ── */}
            <rect x="-800" y="-800" width="2000" height="2120" fill="url(#vignette)" style={{pointerEvents:'none'}}/>
        </svg>
        );
    };

    /* ── ZONE MODAL ─────────────────────────────────────────── */
    const speak = (text) => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        if (window.EduGamer?.applyVoice) window.EduGamer.applyVoice(u); else u.lang = 'it-IT';
        window.speechSynthesis.speak(u);
    };

    /* Ritratto del personaggio (illustrazione Canva) con badge della zona.
       Se l'immagine manca, mostra l'emoji del personaggio. */
    const CharPortrait = ({ char, zone, size = 84 }) => {
        const [broken, setBroken] = useState(false);
        return (
            <div className="relative flex-shrink-0" style={{width:size, height:size}}>
                <div className="w-full h-full rounded-full overflow-hidden flex items-center justify-center"
                    style={{background:'radial-gradient(circle at 35% 30%,#1e3a5f,#071226)', border:`3px solid ${zone.color}`,
                        boxShadow:`0 0 22px ${zone.color}55, inset 0 0 0 3px rgba(251,191,36,0.25)`, fontSize: size * 0.5}}>
                    {char.img && !broken
                        ? <img src={char.img} alt={char.name} onError={() => setBroken(true)} style={{width:'100%', height:'100%', objectFit:'cover'}}/>
                        : char.emoji}
                </div>
                <div className="absolute flex items-center justify-center rounded-full"
                    style={{width:size*0.38, height:size*0.38, right:-4, bottom:-4, fontSize:size*0.2,
                        background:'#0f172a', border:`2px solid ${zone.color}`}}>
                    {zone.emoji}
                </div>
            </div>
        );
    };

    /* Zona ancora nella nebbia: mostra quando si svela */
    const LockedZoneModal = ({ zone, xp, onClose }) => {
        const need = Math.max(0, LEVEL_XP[zone.unlockLevel - 1] - xp);
        const pct = Math.min(100, Math.round(xp / LEVEL_XP[zone.unlockLevel - 1] * 100));
        return (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3"
                style={{background:'rgba(2,6,23,0.8)'}} onClick={onClose}>
                <div className="w-full max-w-md rounded-3xl p-6 text-center modal-enter relative overflow-hidden"
                    style={{background:'linear-gradient(170deg,#1e293b,#0b1324)', border:'2px solid #475569', boxShadow:'0 20px 60px rgba(0,0,0,0.6)'}}
                    onClick={e => e.stopPropagation()}>
                    <div className="text-5xl mb-2" style={{filter:'grayscale(0.6) drop-shadow(0 0 14px rgba(148,163,184,0.5))'}}>🌫️</div>
                    <h2 className="title-pirate text-2xl font-black text-slate-100 mb-1">{zone.name}</h2>
                    <p className="text-slate-400 text-sm mb-4">Questa terra è ancora avvolta nella nebbia.</p>
                    <div className="rounded-2xl p-4 mb-4" style={{background:'rgba(251,191,36,0.08)', border:'1px solid rgba(251,191,36,0.3)'}}>
                        <p className="text-yellow-300 font-bold mb-2">Si svela al Livello {zone.unlockLevel}</p>
                        <div style={{height:'10px', background:'#0f172a', borderRadius:'9999px', overflow:'hidden'}}>
                            <div className="xp-fill" style={{height:'100%', width:`${pct}%`, borderRadius:'9999px'}}/>
                        </div>
                        <p className="text-slate-300 text-sm mt-2">Mancano <strong className="text-yellow-300">{need} XP</strong></p>
                    </div>
                    <button onClick={onClose} className="w-full py-4 rounded-2xl font-bold text-white bg-slate-700 border border-slate-500 active:scale-95 transition-transform">
                        ⚓ Torna alla mappa
                    </button>
                </div>
            </div>
        );
    };

    const ZoneModal = ({ zone, onClose, paths = [] }) => {
        const char = CHARACTERS[zone.charId];
        const path = zone.pathKey ? paths.find(p => p.key === zone.pathKey) : null;
        useEffect(() => () => window.speechSynthesis?.cancel(), []);
        return (
            <div className="fixed inset-0 z-50 flex items-end justify-center p-3"
                style={{background:'rgba(0,0,0,0.78)'}} onClick={onClose}>
                <div className="w-full max-w-lg rounded-3xl overflow-hidden modal-enter"
                    style={{background:'linear-gradient(160deg,#1e293b,#0f172a)', border:`2px solid ${zone.color}`, boxShadow:`0 0 50px ${zone.color}40`}}
                    onClick={e => e.stopPropagation()}>
                    {/* Header */}
                    <div className="flex items-center gap-4 p-5 pb-4" style={{borderBottom:`1px solid ${zone.color}25`}}>
                        <CharPortrait char={char} zone={zone} size={84}/>
                        <div className="flex-1 min-w-0">
                            <h2 className="text-xl font-black text-white leading-tight">{zone.name}</h2>
                            <p className="text-sm font-bold mt-0.5" style={{color:zone.color}}>{char.emoji} {char.name}</p>
                        </div>
                        <button onClick={onClose} className="w-10 h-10 rounded-full bg-slate-700 text-slate-300 text-lg flex items-center justify-center flex-shrink-0">✕</button>
                    </div>
                    <div className="p-5 pt-4">
                        {/* Character greeting */}
                        <div className="rounded-2xl p-4 mb-4 text-sm leading-relaxed relative"
                            style={{background:'linear-gradient(150deg,#f5e8c0,#ead9a0)', border:'2px solid #8b6410', color:'#3b2506',
                                boxShadow:'inset 0 0 24px rgba(139,100,16,0.25)'}}>
                            <p className="m-0 pr-14">{char.greeting}</p>
                            <button onClick={() => speak(char.greeting)} aria-label={`Ascolta ${char.name}`}
                                className="absolute top-3 right-3 w-12 h-12 rounded-full flex items-center justify-center text-xl active:scale-90 transition-transform"
                                style={{background:'#78350f', color:'#fde68a', border:'2px solid #fbbf24'}}>
                                🔊
                            </button>
                        </div>

                        {/* Path stats */}
                        {path ? (
                            <div>
                                <div style={{display:'flex', alignItems:'center', gap:'10px', marginBottom:'12px'}}>
                                    <span style={{fontSize:'30px'}}>{path.emoji}</span>
                                    <div>
                                        <div style={{color:'#e2e8f0', fontWeight:900, fontSize:'17px'}}>{path.tierName}</div>
                                        <div style={{color:zone.color, fontSize:'12px', marginTop:'2px'}}>{path.desc}</div>
                                    </div>
                                    <div style={{marginLeft:'auto', textAlign:'right'}}>
                                        <span style={{color:zone.color, fontWeight:900, fontSize:'26px'}}>{path.value}</span>
                                    </div>
                                </div>
                                {/* Progress bar */}
                                <div style={{marginBottom:'10px'}}>
                                    <div style={{display:'flex', justifyContent:'space-between', fontSize:'11px', marginBottom:'5px', color:'#64748b'}}>
                                        <span style={{color:'#94a3b8', fontWeight:'bold'}}>{path.tierName}</span>
                                        <span>{path.isMax ? '🏆 MASSIMO!' : `→ ${path.nextTierName} (${path.nextTierMin})`}</span>
                                    </div>
                                    <div style={{height:'10px', background:'rgba(15,23,42,0.8)', borderRadius:'9999px', overflow:'hidden', border:`1px solid ${zone.color}20`}}>
                                        <div style={{height:'100%', width:`${path.progress}%`,
                                            background:`linear-gradient(90deg,${zone.color}88,${zone.color})`,
                                            borderRadius:'9999px', transition:'width 0.6s ease-out'}}/>
                                    </div>
                                    <div style={{textAlign:'right', fontSize:'10px', color:'#475569', marginTop:'3px'}}>{path.progress}%</div>
                                </div>
                                {path.isMax ? (
                                    <div style={{textAlign:'center', padding:'10px', background:`${zone.color}18`, borderRadius:'12px',
                                        border:`1px solid ${zone.color}40`, fontSize:'13px', color:zone.color, fontWeight:'bold'}}>
                                        🏆 Hai raggiunto il rango massimo!
                                    </div>
                                ) : (
                                    <div style={{textAlign:'center', padding:'10px', background:`${zone.color}08`, borderRadius:'12px',
                                        border:`1px solid ${zone.color}20`, fontSize:'12px', color:'#94a3b8'}}>
                                        Continua a studiare per diventare <strong style={{color:zone.color}}>{path.nextTierName}</strong>!
                                    </div>
                                )}
                            </div>
                        ) : zone.link ? (
                            <a href={zone.link}
                                className="flex items-center justify-center gap-3 w-full py-4 rounded-2xl font-black text-lg text-black active:scale-95 transition-transform"
                                style={{background:`linear-gradient(135deg,${zone.color},${zone.color}bb)`, boxShadow:`0 4px 24px ${zone.color}50`}}>
                                {zone.emoji} ENTRA NELLA ZONA!
                            </a>
                        ) : zone.id === 'fortezza' ? (
                            <div className="text-center py-4 rounded-2xl bg-slate-800/80 border border-slate-700">
                                <p className="text-2xl mb-2">🏆</p>
                                <p className="text-slate-300 font-bold text-sm">Raggiungi il Livello 10</p>
                                <p className="text-slate-500 text-xs mt-1">per sbloccare la Fortezza del Gran Corsaro</p>
                            </div>
                        ) : (
                            <div className="text-center py-4 rounded-2xl bg-slate-800/80 border border-slate-700">
                                <p className="text-2xl mb-2">🗝️</p>
                                <p className="text-slate-300 font-bold text-sm">Zona in esplorazione</p>
                                <p className="text-slate-500 text-xs mt-1">I segreti si riveleranno con il tempo</p>
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );
    };

    /* ── LEVEL-UP OVERLAY ───────────────────────────────────── */
    const LevelUpOverlay = ({ zone, onClose }) => (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 overlay-enter"
            style={{background:'rgba(0,0,0,0.88)'}} onClick={onClose}>
            <div className="text-center">
                <div className="mb-4 inline-block"
                    style={{animation:'float 1.2s ease-in-out infinite', filter:`drop-shadow(0 0 22px ${CHARACTERS[zone.charId]?.color||'#fbbf24'})`}}>
                    <CharPortrait char={CHARACTERS[zone.charId]} zone={zone} size={140}/>
                </div>
                <div className="text-4xl mb-3">✨</div>
                <div className="text-yellow-400 font-black text-2xl mb-2" style={{textShadow:'0 0 20px rgba(251,191,36,0.8)'}}>
                    NUOVA ZONA SBLOCCATA!
                </div>
                <div className="text-white text-xl font-bold mb-2">{zone.name}</div>
                <div className="text-slate-300 text-sm mb-6">{CHARACTERS[zone.charId]?.emoji} {CHARACTERS[zone.charId]?.name} ti aspetta!</div>
                <button onClick={onClose}
                    className="bg-yellow-500 text-black font-black px-10 py-3 rounded-2xl text-lg active:scale-95 transition-transform"
                    style={{boxShadow:'0 0 25px rgba(251,191,36,0.6)'}}>
                    ⚓ Andiamo!
                </button>
            </div>
        </div>
    );

    /* ── AVATAR HISTORY MODAL ──────────────────────────────── */
    const AvatarHistoryModal = ({ history, onClose }) => (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overlay-enter"
            style={{background:'rgba(0,0,0,0.88)'}} onClick={onClose}>
            <div style={{
                background:'linear-gradient(160deg,#1e293b,#0f172a)',
                border:'2px solid rgba(251,191,36,0.3)',
                borderRadius:'20px', width:'100%', maxWidth:'380px',
                maxHeight:'82vh', overflow:'hidden', display:'flex', flexDirection:'column'
            }} onClick={e => e.stopPropagation()}>
                <div style={{padding:'16px 20px 12px', borderBottom:'1px solid rgba(251,191,36,0.12)', flexShrink:0, textAlign:'center'}}>
                    <div style={{fontSize:'32px', marginBottom:'4px'}}>🕰️</div>
                    <h2 style={{color:'#fbbf24', fontWeight:900, fontSize:'18px', margin:0}}>Storico Avatar</h2>
                    <p style={{color:'#64748b', fontSize:'12px', margin:'4px 0 0'}}>I tuoi avatar pirata nel tempo</p>
                </div>
                <div style={{overflowY:'auto', padding:'16px', flex:1}}>
                    <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'12px'}}>
                        {history.map((item, i) => (
                            <div key={i} style={{textAlign:'center'}}>
                                <div style={{
                                    width:'80px', height:'80px', borderRadius:'50%',
                                    overflow:'hidden', margin:'0 auto 6px',
                                    border: i === 0 ? '3px solid #fbbf24' : '2px solid rgba(71,85,105,0.5)',
                                    boxShadow: i === 0 ? '0 0 18px rgba(251,191,36,0.5)' : 'none',
                                    background:'#0f172a', display:'flex', alignItems:'center', justifyContent:'center'
                                }}>
                                    {item.avatarUrl?.startsWith('data:')
                                        ? <img src={item.avatarUrl} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                                        : <span style={{fontSize:'36px'}}>{item.avatarUrl || '🏴‍☠️'}</span>}
                                </div>
                                {i === 0 && <div style={{fontSize:'9px', color:'#fbbf24', fontWeight:'bold', marginBottom:'2px'}}>ATTUALE</div>}
                                <div style={{fontSize:'11px', color:'#94a3b8', fontWeight:'bold'}}>Lv.{item.level}</div>
                                <div style={{fontSize:'10px', color:'#475569'}}>{new Date(item.date).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</div>
                            </div>
                        ))}
                    </div>
                </div>
                <div style={{padding:'12px 16px', flexShrink:0, borderTop:'1px solid rgba(71,85,105,0.2)'}}>
                    <button onClick={onClose}
                        style={{width:'100%', padding:'12px', borderRadius:'12px', background:'rgba(30,41,59,0.8)', border:'1px solid rgba(71,85,105,0.4)', color:'white', fontWeight:'bold', cursor:'pointer', fontSize:'14px'}}>
                        ✕ Chiudi
                    </button>
                </div>
            </div>
        </div>
    );

    /* ── WANTED POSTER MODAL ───────────────────────────────── */
    const WantedPosterModal = ({ poster, onClose }) => (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overlay-enter"
            style={{background:'rgba(0,0,0,0.92)'}} onClick={onClose}>
            <div className="w-full max-w-xs relative" onClick={e => e.stopPropagation()}>
                <img src={`data:${poster.mime};base64,${poster.data}`}
                    alt="Wanted Poster"
                    style={{width:'100%', borderRadius:'16px', border:'4px solid #ca8a04',
                        boxShadow:'0 0 50px rgba(202,138,4,0.7), 0 0 100px rgba(202,138,4,0.3)'}}/>
                <div className="text-center mt-3">
                    <p className="text-yellow-400 font-black text-xl">🏴‍☠️ {poster.name || 'Pirata'}</p>
                    <p className="text-amber-300 text-sm mt-0.5">
                        Taglia: {((poster.xp || 0) * 1000000).toLocaleString('it-IT')} Berry · Lv.{poster.level}
                    </p>
                </div>
                <div className="flex gap-3 mt-4">
                    <a href="profilo.html"
                        className="flex-1 font-bold py-3 rounded-xl text-center active:scale-95 transition-transform border-2 border-orange-500"
                        style={{background:'linear-gradient(135deg,#ea580c,#fbbf24)', color:'#0a0e17'}}>
                        🔄 Rigenera
                    </a>
                    <button onClick={onClose}
                        className="flex-1 bg-slate-700 text-white py-3 rounded-xl font-bold active:scale-95 transition-transform border border-slate-600">
                        ✕ Chiudi
                    </button>
                </div>
            </div>
        </div>
    );

    /* ── SHARED UI PRIMITIVES (fuori da App per evitare remount ad ogni render) ── */
    const WantedMiniCard = ({ wantedPoster, onShow, size = 60 }) => {
        const imgW = size - 8;
        const imgH = Math.round(imgW * 1.3);
        return wantedPoster ? (
            <button onClick={onShow} aria-label="Mostra il tuo Wanted Poster"
                style={{display:'block', background:'none', border:'none', padding:0, cursor:'pointer'}}>
                <div style={{background:'linear-gradient(135deg,#1a0800,#3d1a00)', border:'2px solid #ca8a04',
                    borderRadius:'10px', padding:'4px', boxShadow:'0 0 18px rgba(202,138,4,0.5)', width:size+'px'}}>
                    <img src={`data:${wantedPoster.mime};base64,${wantedPoster.data}`}
                        alt="Il tuo poster Wanted"
                        style={{width:imgW+'px', height:imgH+'px', objectFit:'cover', borderRadius:'6px', display:'block'}}/>
                    <div style={{textAlign:'center', fontSize:'7px', color:'#fbbf24', fontWeight:'bold', marginTop:'3px', letterSpacing:'0.08em'}}>WANTED</div>
                </div>
            </button>
        ) : (
            <a href="profilo.html" style={{display:'block'}} aria-label="Crea il tuo poster Wanted">
                <div style={{background:'rgba(10,20,40,0.85)', border:'2px dashed rgba(202,138,4,0.35)',
                    borderRadius:'10px', padding:'8px 4px', textAlign:'center', width:size+'px', boxShadow:'0 0 8px rgba(0,0,0,0.4)'}}>
                    <div style={{fontSize:'22px'}}>🏴‍☠️</div>
                    <div style={{fontSize:'6.5px', color:'rgba(202,138,4,0.65)', fontWeight:'bold', lineHeight:'1.3', marginTop:'3px', letterSpacing:'0.04em'}}>CREA<br/>POSTER</div>
                </div>
            </a>
        );
    };

    const AvatarBtn = ({ profile, onEdit, size = 44, fontSize = '20px' }) => (
        <button onClick={onEdit} aria-label="Modifica il tuo profilo pirata"
            style={{width:size+'px', height:size+'px', borderRadius:'50%', border:'2px solid #fbbf24',
                flexShrink:0, overflow:'hidden', background:'#1e293b', cursor:'pointer',
                display:'flex', alignItems:'center', justifyContent:'center',
                boxShadow:'0 0 14px rgba(251,191,36,0.35)'}}>
            {profile?.avatarUrl?.startsWith('data:')
                ? <img src={profile.avatarUrl} alt="" style={{width:'100%', height:'100%', objectFit:'cover'}}/>
                : <span style={{fontSize}}>{profile?.avatarUrl || '🏴‍☠️'}</span>}
        </button>
    );

    /* ── APP ────────────────────────────────────────────────── */
    const App = () => {
        const [stage,         setStage]         = useState('loading');
        const [profile,       setProfile]       = useState(null);
        const [stats,         setStats]         = useState({ xp:0, level:1 });
        const [selectedZone,  setSelectedZone]  = useState(null);
        const [justUnlocked,  setJustUnlocked]  = useState(null);
        const [showParchment, setShowParchment] = useState(false);
        const [wantedPoster,  setWantedPoster]  = useState(null);
        const [showWanted,    setShowWanted]     = useState(false);
        const [avatarHistory, setAvatarHistory] = useState([]);
        const [showHistory,   setShowHistory]   = useState(false);
        const [isLandscape,   setIsLandscape]   = useState(
            () => window.innerWidth > window.innerHeight + 50 && window.innerWidth >= 640
        );
        const [paths,         setPaths]         = useState([]);

        useEffect(() => {
            const p = DB.getProfile(), s = DB.getStats();
            setStats(s); setProfile(p);
            setWantedPoster(DB.getWantedPoster());
            setAvatarHistory(DB.getAvatarHistory());
            setPaths(DB.getPaths());
            const editMode = new URLSearchParams(window.location.search).get('edit') === '1';
            setStage((p && !editMode) ? 'island' : 'onboarding');
            const onXP = () => {
                const ns = DB.getStats();
                setPaths(DB.getPaths());
                setStats(prev => {
                    if (ns.level > prev.level) {
                        const z = ZONES.find(z => z.unlockLevel === ns.level);
                        if (z) setJustUnlocked(z);
                    }
                    return ns;
                });
            };
            window.addEventListener('edugamer-xp-added', onXP);
            window.addEventListener('xpChanged', onXP);
            return () => { window.removeEventListener('edugamer-xp-added', onXP); window.removeEventListener('xpChanged', onXP); };
        }, []);

        useEffect(() => {
            const check = () => setIsLandscape(window.innerWidth > window.innerHeight + 50 && window.innerWidth >= 640);
            window.addEventListener('resize', check);
            const onOrient = () => setTimeout(check, 250);
            window.addEventListener('orientationchange', onOrient);
            return () => { window.removeEventListener('resize', check); window.removeEventListener('orientationchange', onOrient); };
        }, []);

        useEffect(() => {
            if (stage === 'island') setAvatarHistory(DB.getAvatarHistory());
        }, [stage]);

        const xp = xpProgress(stats.xp);

        if (stage === 'loading') return (
            <div className="h-screen flex items-center justify-center" style={{background:'#071020'}}>
                <div className="text-6xl inline-block" style={{animation:'float 1s ease-in-out infinite'}}>🏴‍☠️</div>
            </div>
        );
        if (stage === 'onboarding') return (
            <Onboarding existing={profile} onComplete={p => { setProfile(p); setStage('island'); }}/>
        );

        // Modali condizionali — inlinati più sotto in ogni layout per evitare
        // il bug di remount che avevano dentro un sotto-componente definito in App.
        const renderModals = () => <>
            {selectedZone  && (stats.level >= selectedZone.unlockLevel
                ? <ZoneModal zone={selectedZone} paths={paths} onClose={() => setSelectedZone(null)}/>
                : <LockedZoneModal zone={selectedZone} xp={stats.xp} onClose={() => setSelectedZone(null)}/>)}
            {justUnlocked  && <LevelUpOverlay zone={justUnlocked} onClose={() => setJustUnlocked(null)}/>}
            {showParchment && <ParchmentModal onClose={() => setShowParchment(false)}/>}
            {showWanted && wantedPoster && <WantedPosterModal poster={wantedPoster} onClose={() => setShowWanted(false)}/>}
            {showHistory && avatarHistory.length > 0 && <AvatarHistoryModal history={avatarHistory} onClose={() => setShowHistory(false)}/>}
        </>;

        // ════════════════════════════════════════════════════════
        // LANDSCAPE LAYOUT (tablets / desktop)
        // ════════════════════════════════════════════════════════
        if (isLandscape) return (
            <div style={{position:'fixed', inset:0, display:'flex', overflow:'hidden', background:'#071020'}}>

                {/* ── LEFT: Island Map (58%) ── */}
                <div style={{flex:'0 0 58%', position:'relative', overflow:'hidden', height:'100%'}}>
                    <div style={{width:'100%', height:'100%'}}>
                        <IslandSVG level={stats.level} onZoneClick={setSelectedZone} avatarHistory={avatarHistory}/>
                    </div>
                    {/* Wanted card — bottom left of map */}
                    <div style={{position:'absolute', bottom:'16px', left:'16px', zIndex:10}}>
                        <WantedMiniCard wantedPoster={wantedPoster} onShow={() => setShowWanted(true)} size={68}/>
                    </div>
                    {/* Hint overlay */}
                    <div style={{position:'absolute', bottom:0, left:0, right:0, textAlign:'center',
                        padding:'6px', background:'linear-gradient(0deg,rgba(5,12,26,0.85),transparent)', color:'#e2e8f0', fontSize:'12px', zIndex:5}}>
                        🗺️ Tocca una zona per esplorarla
                    </div>
                </div>

                {/* ── RIGHT: Info Panel (42%) ── */}
                <div style={{flex:'0 0 42%', display:'flex', flexDirection:'column', overflow:'hidden',
                    background:'linear-gradient(180deg,#0c1830 0%,#060d1c 100%)', borderLeft:'2px solid rgba(251,191,36,0.3)', boxShadow:'-10px 0 30px rgba(0,0,0,0.5)'}}>

                    {/* Avatar + Name + XP */}
                    <div style={{padding:'18px 20px 14px', flexShrink:0, borderBottom:'1px solid rgba(251,191,36,0.08)'}}>
                        <div style={{display:'flex', alignItems:'center', gap:'14px', marginBottom:'12px'}}>
                            <AvatarBtn profile={profile} onEdit={() => setStage('onboarding')} size={68} fontSize="28px"/>
                            <div style={{flex:1, minWidth:0}}>
                                <div style={{color:'#fcd34d', fontWeight:900, fontSize:'19px', lineHeight:1.2,
                                    overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                                    {profile?.name || 'Pirata'}
                                </div>
                                <div style={{color:'#cbd5e1', fontSize:'12px', marginTop:'3px'}}>
                                    Lv.{stats.level} · {getLevelName(stats.level)}
                                </div>
                            </div>
                            {avatarHistory.length > 0 && (
                                <button onClick={() => setShowHistory(true)} className="icon-btn" aria-label="Storico avatar">
                                    🕰️
                                </button>
                            )}
                        </div>
                        {/* XP Bar */}
                        <div style={{display:'flex', justifyContent:'space-between', marginBottom:'5px', fontSize:'11px'}}>
                            <span style={{color:'#fbbf24', fontWeight:'bold'}}>{xp.cur} / {xp.needed} XP</span>
                            <span style={{color:'#94a3b8'}}>{xp.pct}%</span>
                        </div>
                        <div className="xp-bar-anim" style={{height:'9px', background:'#1e293b', borderRadius:'9999px', overflow:'hidden'}}>
                            <div className="xp-fill" style={{height:'100%', width:`${xp.pct}%`,
                                borderRadius:'9999px', transition:'width 0.7s ease-out'}}/>
                        </div>
                    </div>

                    {/* 4 Percorsi — scrollable */}
                    <div style={{flex:1, overflowY:'auto', padding:'10px 14px'}}>
                        <div style={{fontSize:'10px', color:'#fbbf24', fontWeight:'bold', textTransform:'uppercase',
                            letterSpacing:'0.1em', marginBottom:'8px'}}>
                            I tuoi percorsi · {stats.xp} XP totali
                        </div>
                        {paths.length === 0 ? (
                            <div style={{color:'#334155', fontSize:'12px', textAlign:'center', padding:'20px 0'}}>
                                Caricamento percorsi...
                            </div>
                        ) : (
                            <div style={{display:'flex', flexDirection:'column', gap:'7px'}}>
                                {paths.map(path => (
                                    <div key={path.key} style={{
                                        padding:'11px 13px', borderRadius:'13px',
                                        background:`${path.color}0d`,
                                        border:`1px solid ${path.color}28`
                                    }}>
                                        <div style={{display:'flex', alignItems:'center', gap:'8px', marginBottom:'7px'}}>
                                            <span style={{fontSize:'20px', flexShrink:0}}>{path.emoji}</span>
                                            <div style={{flex:1, minWidth:0}}>
                                                <div style={{fontWeight:'bold', fontSize:'12px', color:'#e2e8f0',
                                                    overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                                                    {path.name} · <span style={{color:path.color}}>{path.tierName}</span>
                                                </div>
                                                <div style={{fontSize:'10px', color:'#94a3b8', marginTop:'1px'}}>
                                                    {path.value} {path.desc.toLowerCase()}
                                                    {!path.isMax && ` · → ${path.nextTierName}`}
                                                </div>
                                            </div>
                                            {path.isMax
                                                ? <span style={{fontSize:'16px', flexShrink:0}}>🏆</span>
                                                : <span style={{color:'#475569', fontSize:'11px', flexShrink:0, fontWeight:'bold'}}>{path.progress}%</span>
                                            }
                                        </div>
                                        <div style={{height:'5px', background:'rgba(10,18,38,0.7)', borderRadius:'9999px', overflow:'hidden'}}>
                                            <div style={{height:'100%', width:`${path.progress}%`,
                                                background:`linear-gradient(90deg,${path.color}88,${path.color})`,
                                                borderRadius:'9999px', transition:'width 0.7s ease-out'}}/>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Bottom action buttons */}
                    <div style={{padding:'10px 16px 14px', flexShrink:0, borderTop:'1px solid rgba(251,191,36,0.08)',
                        display:'flex', gap:'8px'}}>
                        <button onClick={() => setShowParchment(true)}
                            style={{flex:1, minHeight:'56px', padding:'10px', borderRadius:'14px', fontSize:'22px', cursor:'pointer',
                                background:'rgba(120,80,10,0.3)', border:'1px solid rgba(139,100,16,0.35)'}}>
                            📜
                        </button>
                        <a href="profilo.html"
                            style={{flex:1, minHeight:'56px', padding:'10px', borderRadius:'14px', fontSize:'22px',
                                background:'rgba(99,40,160,0.3)', border:'1px solid rgba(139,92,246,0.35)',
                                display:'flex', alignItems:'center', justifyContent:'center', textDecoration:'none'}}>
                            🏆
                        </a>
                        <a href="index.html"
                            style={{flex:1, minHeight:'56px', padding:'10px', borderRadius:'14px', fontSize:'22px',
                                background:'rgba(30,41,59,0.8)', border:'1px solid rgba(71,85,105,0.35)',
                                display:'flex', alignItems:'center', justifyContent:'center', textDecoration:'none'}}>
                            🏠
                        </a>
                    </div>
                </div>

                {renderModals()}
            </div>
        );

        // ════════════════════════════════════════════════════════
        // PORTRAIT LAYOUT (smartphones)
        // ════════════════════════════════════════════════════════
        return (
            <div style={{position:'fixed', inset:0, display:'flex', flexDirection:'column', overflow:'hidden', background:'#071020'}}>

                {/* TOP BAR */}
                <div className="deck-bar" style={{flexShrink:0, display:'flex', alignItems:'center', gap:'8px', padding:'8px 10px', position:'relative', zIndex:5}}>
                    <AvatarBtn profile={profile} onEdit={() => setStage('onboarding')} size={44} fontSize="20px"/>
                    <div style={{flex:1, minWidth:0}}>
                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:'4px'}}>
                            <span style={{color:'#fcd34d', fontWeight:900, fontSize:'14px',
                                overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                                {profile?.name || 'Pirata'}
                            </span>
                            <span style={{color:'#cbd5e1', fontSize:'11px', flexShrink:0, marginLeft:'4px'}}>
                                Lv.{stats.level} · {getLevelName(stats.level)}
                            </span>
                        </div>
                        <div className="xp-bar-anim" style={{height:'8px', background:'#1e293b', borderRadius:'9999px', overflow:'hidden'}}>
                            <div className="xp-fill" style={{height:'100%', width:`${xp.pct}%`,
                                borderRadius:'9999px', transition:'width 0.7s ease-out', boxShadow:'0 0 8px rgba(251,191,36,0.5)'}}/>
                        </div>
                        <div style={{color:'#94a3b8', fontSize:'10px', marginTop:'2px'}}>{xp.cur} / {xp.needed} XP</div>
                    </div>
                    {avatarHistory.length > 0 && (
                        <button onClick={() => setShowHistory(true)} className="icon-btn" aria-label="Storico avatar">
                            🕰️
                        </button>
                    )}
                    <button onClick={() => setShowParchment(true)} className="icon-btn icon-btn--gold" aria-label="Leggi la pergamena">
                        📜
                    </button>
                    <a href="index.html" className="icon-btn" aria-label="Torna alla Home">
                        🏠
                    </a>
                </div>

                {/* MAP */}
                <div style={{flex:1, position:'relative', overflow:'hidden'}}>
                    <div style={{width:'100%', height:'100%'}}>
                        <IslandSVG level={stats.level} onZoneClick={setSelectedZone} avatarHistory={avatarHistory}/>
                    </div>
                    {/* Wanted card — bottom left */}
                    <div style={{position:'absolute', bottom:'16px', left:'16px', zIndex:10}}>
                        <WantedMiniCard wantedPoster={wantedPoster} onShow={() => setShowWanted(true)} size={60}/>
                    </div>
                </div>

                {/* BOTTOM HINT */}
                <div style={{flexShrink:0, textAlign:'center', padding:'6px', color:'#cbd5e1', fontSize:'12px',
                    background:'linear-gradient(0deg,rgba(5,12,26,0.97),rgba(12,24,48,0.95))', borderTop:'1px solid rgba(251,191,36,0.22)'}}>
                    🗺️ Tocca una zona per esplorarla · {stats.xp} XP · Livello {stats.level}
                </div>

                {renderModals()}
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="game-system.js"></script>
</body>
</html>
